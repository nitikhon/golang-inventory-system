root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/main"
  cmd = "go build -v -o ./tmp/main ./cmd/server/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor"]
  exclude_file = []
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "yaml", "env"]
  kill_delay = "1s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true
  poll = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false